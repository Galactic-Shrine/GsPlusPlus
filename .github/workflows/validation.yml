name: Validation Gs++

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows / MSBuild natif sans CMake
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Construire et tester sans CMake
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $msbuild = & $vswhere -latest -version '[18.0,19.0)' -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild Visual Studio 2026 absent' }
          & $msbuild GsPlusPlus.slnx /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $msbuild VisualStudio/Validation.vcxproj /m /p:Configuration=Release /p:Platform=x64 /v:minimal
          exit $LASTEXITCODE

  windows:
    name: Windows / Visual Studio 2026
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Configurer
        run: cmake -S . -B Construction/CI -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=ON
      - name: Construire
        run: cmake --build Construction/CI --config Release --target espace_travail --parallel
      - name: Tester
        run: ctest --test-dir Construction/CI -C Release --output-on-failure

  linux:
    name: Linux / GNU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configurer
        run: cmake -S . -B Construction/CI -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Construire
        run: cmake --build Construction/CI --target espace_travail --parallel
      - name: Tester
        run: ctest --test-dir Construction/CI --output-on-failure
